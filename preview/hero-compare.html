<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Compare — TRACE Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #0a0a0a; color: #f5f5f5; }
    h1 { font-size: 1rem; font-weight: 600; padding: 1rem; text-align: center; }
    .grid { display: grid; gap: 1rem; padding: 1rem; max-width: 1200px; margin: 0 auto; }
    .card { background: #141414; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; }
    .card h2 { font-size: .875rem; padding: .75rem 1rem; margin: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .frame { aspect-ratio: 1024 / 768; overflow: hidden; position: relative; }
    .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; transform: scale(1.06); }
    .frame--mobile { max-width: 390px; margin: 0 auto; }
    .note { padding: 1rem; font-size: .8125rem; color: rgba(245,245,245,.6); text-align: center; }
  </style>
</head>
<body>
  <h1>ファーストビュー候補比較（ローカルプレビュー）</h1>
  <p class="note">PC表示 / 下段はスマホ幅（390px）での見え方です。公開前の比較用ページです。</p>
  <div class="grid">
    <div class="card">
      <h2>A. ラットプルダウン（現行）</h2>
      <div class="frame"><img src="hero-compare-lat.webp" alt="ラットプルダウン PC" style="object-position:46% 28%"></div>
      <div class="frame frame--mobile"><img src="hero-compare-lat.webp" alt="ラットプルダウン SP" style="object-position:38% 26%"></div>
    </div>
    <div class="card">
      <h2>B. ベンチプレス</h2>
      <div class="frame"><img src="hero-compare-bench.webp" alt="ベンチプレス PC" style="object-position:48% 34%"></div>
      <div class="frame frame--mobile"><img src="hero-compare-bench.webp" alt="ベンチプレス SP" style="object-position:48% 32%"></div>
    </div>
    <div class="card">
      <h2>C. スクワット</h2>
      <div class="frame"><img src="hero-compare-squat.webp" alt="スクワット PC" style="object-position:50% 36%"></div>
      <div class="frame frame--mobile"><img src="hero-compare-squat.webp" alt="スクワット SP" style="object-position:50% 34%"></div>
    </div>
  </div>
</body>
</html>
